[tool.poetry]
name = "netsim"
version = "0.1.0"
description = "Network Topology Simulator for eBPF XDP Development"
authors = ["Peter <peter@gmail.com>"]
readme = "README.md"
packages = [{include = "netsim"}]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
PyYAML = "*"
libvirt-python = "*"
netaddr = "^1.3.0"
tenacity = "^8.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.14.14"
mypy = "^1.19.1"
types-pyyaml = "^6.0.12.20250915"
pytest = "^7.0"
paramiko = "^3.0"
types-paramiko = "*"
types-netaddr = "*"

[tool.poetry.scripts]
netsim = "netsim.cli:main"

[tool.pytest.ini_options]
# Reduce memory usage by limiting result caching
addopts = [
    "-v",
    "--tb=short",
]
# Disable pytest cache to reduce memory
cache_dir = "/tmp/pytest_cache"
markers = [
    "slow: marks tests as slow (scheduler waits, 45+ s); exclude with -m 'not slow'",
]

[tool.mypy]
# libvirt-python ships no type stubs and has no py.typed marker
[[tool.mypy.overrides]]
module = "libvirt"
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
