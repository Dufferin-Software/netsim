[tool.poetry]
name = "netsim"
version = "0.1.0"
description = "Network Topology Simulator for eBPF XDP Development"
authors = ["Peter <peter@gmail.com>"]
readme = "README.md"
packages = [{include = "netsim"}]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
PyYAML = "*"
libvirt-python = "*"
netaddr = "^1.3.0"
tenacity = "^8.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.14.14"
mypy = "^1.19.1"
vulture = "^2.14"
types-pyyaml = "^6.0.12.20250915"
pytest = "^7.0"
paramiko = "^3.0"
types-paramiko = "*"
types-netaddr = "*"

[tool.poetry.scripts]
netsim = "netsim.cli:main"

[tool.pytest.ini_options]
# Reduce memory usage by limiting result caching
log_cli = false
log_cli_level = "INFO"
log_file = "pytest.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s.%(msecs)03d %(levelname)-5s %(name)s:%(filename)s:%(lineno)d %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
addopts = [
    "-v",
    "--tb=short",
    "--log-level=INFO",
]
# Disable pytest cache to reduce memory
cache_dir = "/tmp/pytest_cache"
markers = [
    "slow: marks tests as slow (scheduler waits, 45+ s); exclude with -m 'not slow'",
]

[tool.mypy]
# vulture_whitelist.py deliberately references undefined names (it is parsed
# only by vulture as "usage" markers), so exclude it from type checking.
exclude = ['^vulture_whitelist\.py$']
# libvirt-python ships no type stubs and has no py.typed marker
[[tool.mypy.overrides]]
module = "libvirt"
ignore_missing_imports = true

# scapy and aioquic are only installed on the simulated nodes that run the
# SNI sender scripts (tests/sni_matching/*_sni_send.py), not in the dev venv,
# and ship no type stubs.
[[tool.mypy.overrides]]
module = ["scapy.*", "aioquic.*"]
ignore_missing_imports = true

[tool.vulture]
# Dead-code detection. Scans the netsim/ package only; vulture_whitelist.py
# exempts names that are used from tests/ or via (de)serialization. See the
# `dead-code` target in the Makefile.
paths = ["netsim", "vulture_whitelist.py"]
min_confidence = 60

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
