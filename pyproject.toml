[tool.poetry]
name = "netsim"
version = "0.1.0"
description = "Network Topology Simulator for eBPF XDP Development"
authors = ["Peter <peter@gmail.com>"]
readme = "README.md"
packages = [{include = "netsim"}]
# netsim/py.typed: consumers type-check against these annotations.
include = [{path = "netsim/py.typed", format = ["sdist", "wheel"]}]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
PyYAML = "*"
libvirt-python = "*"
netaddr = "^1.3.0"
tenacity = "^8.0"
# netsim.testkit only. Install with the `testkit` extra to get them; the
# simulator itself runs without either.
paramiko = {version = "^3.0", optional = true}
pytest = {version = "^7.0", optional = true}

[tool.poetry.extras]
testkit = ["paramiko", "pytest"]

[tool.poetry.group.dev.dependencies]
ruff = "^0.14.14"
mypy = "^1.19.1"
vulture = "^2.14"
types-pyyaml = "^6.0.12.20250915"
pytest = "^7.0"
paramiko = "^3.0"
types-paramiko = "*"
types-netaddr = "*"

[tool.poetry.scripts]
netsim = "netsim.cli:main"

[tool.pytest.ini_options]
# Reduce memory usage by limiting result caching
log_cli = false
log_cli_level = "INFO"
log_file = "pytest.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s.%(msecs)03d %(levelname)-5s %(name)s:%(filename)s:%(lineno)d %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
addopts = [
    "-v",
    "--tb=short",
    "--log-level=INFO",
]
# Disable pytest cache to reduce memory
cache_dir = "/tmp/pytest_cache"
markers = [
    "slow: marks tests as slow (scheduler waits, 45+ s); exclude with -m 'not slow'",
]

[tool.mypy]
# vulture_whitelist.py deliberately references undefined names (it is parsed
# only by vulture as "usage" markers), so exclude it from type checking.
exclude = ['^vulture_whitelist\.py$']
# libvirt-python ships no type stubs and has no py.typed marker
[[tool.mypy.overrides]]
module = "libvirt"
ignore_missing_imports = true

[tool.vulture]
# Dead-code detection. Scans the netsim/ package; vulture_whitelist.py exempts
# names that are used from tests/ or via (de)serialization. See the `dead-code`
# target in the Makefile.
paths = ["netsim", "vulture_whitelist.py"]
# netsim/testkit is a library for consumers, so most of its surface has no
# caller inside this repo. Dead code there is found by the projects using it.
exclude = ["netsim/testkit"]
min_confidence = 60

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
