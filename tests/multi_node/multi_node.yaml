name: "multi-node"
version: "1.0"

networks:
  - name: "mgmt"
    subnet: "10.10.0.0/24"
    mtu: 1500

  - name: "data"
    subnet: "10.20.0.0/24"
    mtu: 1500

nodes:
  # Controller node — runs policy-controller daemon
  - name: "controller"
    image:
      name: "debian-13-genericcloud"
      url: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
      checksum: "09559ec27d263997827dd8cddf76e97ea8e0f1803380aa501ea7eaa4b4968cd76ffef4ec7eb07ef1a9ccbeb0925a5020492ea9ed53eb167d62f3a2285039912c"
    memory: 512
    vcpus: 1
    networks:
      - "mgmt"

  # Node 1: runs policy-engine + policy-node-agent
  - name: "node1"
    image:
      name: "debian-13-genericcloud"
      url: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
      checksum: "09559ec27d263997827dd8cddf76e97ea8e0f1803380aa501ea7eaa4b4968cd76ffef4ec7eb07ef1a9ccbeb0925a5020492ea9ed53eb167d62f3a2285039912c"
    memory: 1024
    vcpus: 2
    networks:
      - "mgmt"
      - "data"

  # Node 2: runs policy-engine + policy-node-agent
  - name: "node2"
    image:
      name: "debian-13-genericcloud"
      url: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
      checksum: "09559ec27d263997827dd8cddf76e97ea8e0f1803380aa501ea7eaa4b4968cd76ffef4ec7eb07ef1a9ccbeb0925a5020492ea9ed53eb167d62f3a2285039912c"
    memory: 1024
    vcpus: 2
    networks:
      - "mgmt"
      - "data"

  # Node 3: runs policy-engine + policy-node-agent (used for decommission test)
  - name: "node3"
    image:
      name: "debian-13-genericcloud"
      url: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
      checksum: "09559ec27d263997827dd8cddf76e97ea8e0f1803380aa501ea7eaa4b4968cd76ffef4ec7eb07ef1a9ccbeb0925a5020492ea9ed53eb167d62f3a2285039912c"
    memory: 1024
    vcpus: 2
    networks:
      - "mgmt"
      - "data"
