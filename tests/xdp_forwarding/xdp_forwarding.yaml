name: "xdp-forwarding-topology"
version: "1.0"

networks:
  - name: "net1"
    subnet: "10.1.1.0/24"
    ipv6_subnet: "2001:db8:1::/64"
    mtu: 1500

  - name: "net2"
    subnet: "10.1.2.0/24"
    ipv6_subnet: "2001:db8:2::/64"
    mtu: 1500

nodes:
  # Client: connects to net1 only
  - name: "client"
    image:
      name: "debian-13-genericcloud"
      url: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
      checksum: "09559ec27d263997827dd8cddf76e97ea8e0f1803380aa501ea7eaa4b4968cd76ffef4ec7eb07ef1a9ccbeb0925a5020492ea9ed53eb167d62f3a2285039912c"
    memory: 512
    vcpus: 1
    networks:
      - "net1"

  # Transit: connects to net1 and net2 — policy-engine runs here
  - name: "transit"
    image:
      name: "debian-13-genericcloud"
      url: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
      checksum: "09559ec27d263997827dd8cddf76e97ea8e0f1803380aa501ea7eaa4b4968cd76ffef4ec7eb07ef1a9ccbeb0925a5020492ea9ed53eb167d62f3a2285039912c"
    memory: 1024
    vcpus: 2
    networks:
      - "net1"
      - "net2"

  # Server: connects to net2 only
  - name: "server"
    image:
      name: "debian-13-genericcloud"
      url: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
      checksum: "09559ec27d263997827dd8cddf76e97ea8e0f1803380aa501ea7eaa4b4968cd76ffef4ec7eb07ef1a9ccbeb0925a5020492ea9ed53eb167d62f3a2285039912c"
    memory: 512
    vcpus: 1
    networks:
      - "net2"
