name: "ips-ids"
version: "1.0"

networks:
  - name: "net1"
    subnet: "10.1.1.0/24"
    ipv6_subnet: "2001:db8:1::/64"
    mtu: 1500

nodes:
  # Server: runs policy-engine + Suricata for IPS/IDS inspection
  - name: "server"
    image:
      name: "debian-13-genericcloud"
      url: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
      checksum: "6da628d0f44ddcc8641d5ed1c7a1b4841ccf6608810a8f7aae860db51e9975e76b3c230728560337b615f8b610a34a760cf9d18e8ddb55c48608a06724ea0892"
    memory: 2048
    vcpus: 2
    networks:
      - "net1"

  # Client: generates traffic for IPS/IDS inspection
  - name: "client"
    image:
      name: "debian-13-genericcloud"
      url: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
      checksum: "6da628d0f44ddcc8641d5ed1c7a1b4841ccf6608810a8f7aae860db51e9975e76b3c230728560337b615f8b610a34a760cf9d18e8ddb55c48608a06724ea0892"
    memory: 512
    vcpus: 1
    networks:
      - "net1"
