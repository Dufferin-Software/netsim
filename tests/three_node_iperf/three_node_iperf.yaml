name: "three-node-topology"
version: "1.0"

networks:
  - name: "net1"
    subnet: "10.1.1.0/24"
    ipv6_subnet: "2001:db8:1::/64"
    mtu: 1500

  - name: "net2"
    subnet: "10.1.2.0/24"
    ipv6_subnet: "2001:db8:2::/64"
    mtu: 1500

nodes:
  # Client: connects to net1
  - name: "client"
    image:
      name: "debian-13-genericcloud"
      url: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
      checksum: "ff30b54d70c1292f9ff1115b2ba95d171e067e784b72d02a1d4bc9d8a6a25ed9"
    memory: 512
    vcpus: 1
    networks:
      - "net1"

  # Transit: connects to net1 and net2 (router)
  - name: "transit"
    image:
      name: "debian-13-genericcloud"
      url: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
      checksum: "ff30b54d70c1292f9ff1115b2ba95d171e067e784b72d02a1d4bc9d8a6a25ed9"
    memory: 512
    vcpus: 1
    networks:
      - "net1"
      - "net2"

  # Server: connects to net2
  - name: "server"
    image:
      name: "debian-13-genericcloud"
      url: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
      checksum: "ff30b54d70c1292f9ff1115b2ba95d171e067e784b72d02a1d4bc9d8a6a25ed9"
    memory: 512
    vcpus: 1
    networks:
      - "net2"
